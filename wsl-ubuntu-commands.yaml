# WSL Ubuntu Commands

## Networking Commands

### Check Active Network Interfaces
```bash
ifconfig
```
Displays all active network interfaces along with their IP addresses.

### Check IP Address
```bash
hostname -I
```
Displays the IP address(es) of the host.

### Ping Command
```bash
ping <hostname>
```
Tests the reachability of a host and measures the round-trip time.

### List Open Ports
```bash
ss -tuln
```
Lists all open ports and the services using them.

## Security Commands

### Update Package List
```bash
sudo apt update
```
Updates the package list to ensure you have the latest information on available packages.

### Upgrade Installed Packages
```bash
sudo apt upgrade
```
Upgrades installed packages to their latest versions.

### Install Firewall
```bash
sudo apt install ufw
```
Installs Uncomplicated Firewall (UFW) for easier firewall management.

### Enable Firewall
```bash
sudo ufw enable
```
Enables the firewall to restrict access to the system.

### Deny All Incoming Traffic
```bash
sudo ufw default deny incoming
```
Sets the default policy to deny all incoming connections.
